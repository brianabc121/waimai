# Development / single-host layout. For production put TLS here and enable
# HTTP/2 ("listen 443 ssl; http2 on;"): browsers allow only 6 HTTP/1.1
# connections per origin, and every open screen holds one SSE stream.
server {
    listen 80;
    server_name _;

    # When a TLS proxy on the same host or private network sits in front
    # (Caddy, a load balancer), take the visitor's address from it so the
    # per-address rate limits see real clients. Public addresses are never trusted.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Look the api container up through Docker's DNS on each use instead of
    # once at start, so Nginx keeps working after the api container is
    # recreated (an upgrade or a changed .env gives it a new address).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Server-sent events: no buffering, read timeout well above the 20s heartbeat.
    location ~ ^/api/v1/.*/events$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Promotional pictures and videos of a store: up to 20 MB each.
    location ~ ^/api/v1/merchant/branches/[0-9]+/media$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 21m;
        proxy_request_buffering off;
    }

    # ---- Chat (docs/CHAT_DESIGN.md): the browsers' way to OpenIM ----
    # Without the "im" services these answer 502 and nothing else changes.
    # Messages travel on the socket. A signed-in browser could also call
    # OpenIM's whole HTTP API (make groups, add friends, rename itself), so
    # only what the web SDK reads when it signs in is let through (it asks
    # about groups and friends too, and finds none).
    location = /im/ws {
        set $im_ws http://openim-server:10001;
        rewrite ^ / break;
        proxy_pass $im_ws;
        access_log off;   # the address carries the sign-in token
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ~ ^/im/api/((conversation|jssdk|group|friend)/get_[a-z_]+|user/get_users_info)$ {
        set $im_api http://openim-server:10002;
        rewrite ^/im/api/(.*)$ /$1 break;
        proxy_pass $im_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 256k;
    }
    location /im/ { return 403; }
    # OpenIM's callbacks reach the api container directly, never from outside.
    location /im-hooks/ { return 404; }

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # Caddy asks before getting a certificate for a store's own page
    # (on-demand TLS, docs/DEPLOY.md §5.1); it only answers yes or no.
    location = /internal/tls-ask {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
