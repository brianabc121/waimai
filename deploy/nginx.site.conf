# The company website (docs/WEBSITE_DESIGN.md §9): static pages, one folder per
# language, and the one API call the website makes (its form) passed on to the
# ordering system, so the site needs no CORS and shows no other domain.
map $http_accept_language $site_lang {
    default                       zh;
    "~*^zh-(tw|hk|mo|hant)"       zh-Hant;
    "~*^zh"                       zh;
    "~*^en"                       en;
}

server {
    listen 80;
    server_name _;

    # Caddy on the host (or a load balancer on the private network) is in front:
    # take the visitor's address from it, so the API's limits see real visitors.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    root /usr/share/nginx/html;
    # Behind Caddy the scheme and port seen here are not the visitor's: redirect by path only.
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The bare address: the language chosen before (the cookie the ordering
    # system shares), else the browser's. Crawlers send neither: Chinese.
    location = / {
        if ($cookie_lang ~ "^(zh|zh-Hant|en)$") { return 302 /$cookie_lang/; }
        return 302 /$site_lang/;
    }

    location = /api/v1/public/leads {
        limit_except POST { deny all; }
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }
    location /api/ { return 404; }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /shots/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
