# Local development and single-host pilot. In production point DATABASE_URL
# at a managed PostgreSQL and drop the postgres service.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waimai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waimai}
      POSTGRES_DB: waimai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waimai"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off: applies migrations, then exits. api and worker wait for it.
  migrate:
    build: .
    command: ["migrate"]
    environment: &env
      DATABASE_URL: ${DATABASE_URL:-postgres://waimai:waimai@postgres:5432/waimai?sslmode=disable}
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_AUTH: ${SMS_WEBHOOK_AUTH:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${HTTP_PORT:-8000}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional demo data: docker compose run --rm seed
  seed:
    build: .
    command: ["seed"]
    environment: *env
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
