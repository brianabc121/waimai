   </div>

  </div>

 </div>
 <div>

<template id="item">
<div class="stage"><div>
<div class="pc">
 <div class="pcside"><div class="brand">Makati Kitchen</div><div class="it">订单</div><div class="it on">菜单</div><div class="it">优惠券</div><div class="it">店铺设置</div><div class="it">员工</div></div>
 <div class="pcmain">
  <div class="row"><h2>编辑菜品</h2><span class="grow"></span><span class="btn">取消</span><span class="btn primary">保存</span></div>
  <div class="small muted" style="margin-bottom:14px">菜单原文语言：<b>简体中文</b>（在“店铺设置 → 语言”里改）。保存后几秒内自动翻译成另外 11 种语言。</div>
  <div style="display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start">
   <div class="card">
    <div class="field"><label>菜名（原文）</label><div class="input">宫保鸡丁</div></div>
    <div class="field"><label>描述（原文）</label><div class="input ta">花生和干辣椒一起炒的鸡丁，微辣</div></div>
    <div class="field"><label>详情（原文）</label><div class="input ta">鸡腿肉 250g · 花生 · 干辣椒 · 葱段</div></div>
    <div class="field"><label>规格组</label><div class="input">辣度：不辣 / 微辣 / 中辣</div></div>
    <div class="note info">规格组名、选项名、分类名也一样自动翻译，在右边切换“字段”查看。</div>
   </div>
   <div class="card">
    <div class="row" style="margin-bottom:10px"><b style="font-size:15px">多语言</b>
      <span class="seg"><span class="on">菜名</span><span>描述</span><span>详情</span><span>规格</span></span>
      <span class="grow"></span><span class="small muted">已校对 3 / 11</span><span class="btn sm">全部重新机器翻译</span></div>
    <table class="t">
     <tr><th style="width:120px">语言</th><th>译文</th><th style="width:150px">状态</th><th style="width:70px"></th></tr>
     <tr><td class="lname">English<small>英文</small></td><td>Kung Pao Chicken</td><td><span class="tag ok">商家已改</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">繁體中文<small>繁体中文</small></td><td>宮保雞丁</td><td><span class="tag info">简繁转换</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">ไทย<small>泰语</small></td><td>ไก่ผัดกังเปา</td><td><span class="tag">机器翻译</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">Tiếng Việt<small>越南语</small></td><td>Gà xào Kung Pao</td><td><span class="tag">机器翻译</span></td><td><span class="btn sm">改</span></td></tr>
     <tr class="sel"><td class="lname">Français<small>法语</small></td><td><div class="input" style="min-height:30px;padding:4px 8px">Poulet Kung Pao aux cacahuètes</div></td><td><span class="tag ok">商家已改</span></td><td><span class="btn sm primary" style="background:var(--red);color:#fff">好</span></td></tr>
     <tr><td class="lname">العربية<small>阿拉伯文</small></td><td dir="rtl" style="text-align:right">دجاج كونغ باو</td><td><span class="tag">机器翻译</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">Español<small>西班牙语</small></td><td>Pollo Kung Pao</td><td><span class="tag">机器翻译</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">Русский<small>俄语</small></td><td>Курица гунбао</td><td><span class="tag warn">原文改过，待核对</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">日本語<small>日语</small></td><td>宮保鶏丁（鶏肉とピーナッツの辛味炒め）</td><td><span class="tag">机器翻译</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">မြန်မာ<small>缅甸语</small></td><td>ကုန်းပေါင်ကြက်သား</td><td><span class="tag">机器翻译</span></td><td><span class="btn sm">改</span></td></tr>
     <tr><td class="lname">ខ្មែរ<small>高棉语</small></td><td>មាន់កុងប៉ាវ</td><td><span class="tag">机器翻译</span></td><td><span class="btn sm">改</span></td></tr>
    </table>
    <div class="small muted" style="margin-top:10px">“机器翻译”的会在原文改动后自动重翻；“商家已改”的不会被覆盖，原文变了只标“待核对”。</div>
   </div>
  </div>
 </div>
</div>
<div class="caption" style="max-width:none"><b>⑤ 商家端：菜品多语言</b>。商家只填一种语言，其余自动翻译，哪一条都可以手动改。</div>
</div></div>
</template>

<template id="storeinfo">
<div class="stage"><div>
<div class="pc">
 <div class="pcside"><div class="brand">Makati Kitchen</div><div class="it">订单</div><div class="it">菜单</div><div class="it">优惠券</div><div class="it on">店铺设置</div><div class="it">员工</div></div>

<template id="admin">

<div class="pc wide">
 <div class="pcside"><div class="brand">平台后台</div><div class="it">总览</div><div class="it">商户</div><div class="it">商品</div><div class="it">商城</div><div class="it">顾客服务</div><div class="it">平台客服</div><div class="it on">语言适配</div><div class="it">密钥设置</div></div>
