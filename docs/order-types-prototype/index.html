<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统一订单类型 原型</title>
<style>
:root{--brand:#a02c20;--brand-dark:#86231a;--gold:#f0c46a;--ink:#3b1f14;--muted:#7b6657;--line:#e6d8c4;--bg:#f8efe1;--card:#fffaf2;--head:#f4ebde;--ok:#18794e;--warn:#b45309;--bad:#b42318;
--grab:#00b14f;--fp:#d70f64;--shopee:#ee4d2d;--dine:#2f7d4f;--staff:#8a5a2b;--online:#2463a6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{background:#20252b;color:#d7dbe0;padding:14px 10px}
.side .shop{font-weight:700;font-size:17px;color:#fff;padding:4px 10px}
.side .who{font-size:12px;color:#9aa3ad;padding:4px 10px 12px}
.side .who b{background:#3a4049;color:#fff;border-radius:4px;padding:1px 6px;margin-inline-end:6px}
.side .g{padding:9px 10px;font-weight:600;color:#fff}
.side .s{padding:8px 10px 8px 24px;color:#c9ced5;border-radius:8px}
.side .s.on{background:#353b44;color:#fff;border-left:3px solid var(--brand)}
.top{height:44px;background:var(--brand) repeating-radial-gradient(circle at 0 0,transparent 0 10px,rgba(255,255,255,.06) 10px 11px);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px}
.top h1{font-size:18px;margin:0}.top .st{color:var(--gold);font-size:14px}
.main{display:flex;flex-direction:column;min-width:0}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 440px;flex:1;min-height:0}
.left{display:flex;flex-direction:column;background:#fffdf9}
table{border-collapse:collapse;width:100%}
.items th{background:var(--brand-dark);color:#fff;font-weight:600;text-align:left;padding:8px 10px;font-size:13px}
.items td{padding:9px 10px;border-bottom:1px solid var(--line)}
.code{background:#f8e3b2;color:#7a3e00;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;margin-inline-end:6px}
.qty{display:inline-flex;align-items:center;gap:8px}.qty i{font-style:normal;width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;background:#f6d9c9;color:var(--brand);font-weight:700}.qty i.p{background:var(--brand);color:#fff}
.sub{font-size:12px;color:var(--muted)}
.pp{color:var(--muted);text-decoration:line-through;font-size:12px;margin-inline-start:4px}
.bar{margin-top:auto;background:var(--brand-dark);color:#f8e7d0;padding:12px 16px;display:grid;gap:6px}
.bar .r{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.bar b{color:#fff;font-size:15px}.bar .big{font-size:22px;color:#fff;font-weight:800}
.bar .gold{color:var(--gold)}
.right{background:var(--card);border-left:1px solid var(--line);padding:14px;display:grid;gap:10px;align-content:start}
.f{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center}
.f>label{font-weight:600;font-size:13px}.req::after{content:" *";color:var(--bad)}
.in{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;min-height:36px;display:flex;align-items:center;gap:6px}
.in.ph{color:#a89585}.in.focus{border-color:var(--brand);box-shadow:0 0 0 2px #f3d2c8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.chip.on{border-color:var(--brand);color:var(--brand);background:#fbeae3}
.plat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pb{min-width:0;font-size:13px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:flex;align-items:center;gap:8px;font-weight:700}
.pb .lg{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.pb.on{border-color:var(--grab);background:#eafaf1}
.warn{background:#fff4d6;color:#7a4b00;border:1px solid #f1d58f;border-radius:8px;padding:6px 10px;font-size:12.5px}
.info{background:#f3ebdf;color:#5b4636;border-radius:8px;padding:7px 10px;font-size:12.5px}
.money{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;display:grid;gap:5px;font-size:13px}
.money .l{display:flex;justify-content:space-between}.money .l.t{font-weight:800;font-size:15px;border-top:1px dashed var(--line);padding-top:6px}
.money .neg{color:var(--bad)}.money .muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.go{background:var(--brand);color:#fff;border-radius:10px;padding:13px;text-align:center;font-weight:700;font-size:16px}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.t-dine{background:var(--dine)}.t-staff{background:var(--staff)}.t-online{background:var(--online)}.t-web{background:var(--online)}.t-hippo{background:#c2410c}.t-grab{background:var(--grab)}.t-fp{background:var(--fp)}.t-shopee{background:var(--shopee)}
.page{padding:18px 22px;display:grid;gap:14px;align-content:start}
.ph1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph1 h2{font-size:24px;margin:0;color:#2f1810}.ph1 p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs span{padding:9px 16px;font-weight:600;color:#5b4636;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--brand);border-bottom-color:var(--brand)}.tabs .n{color:var(--muted);font-weight:500;margin-inline-start:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{margin:0 0 10px;font-size:17px;color:#2f1810}
.grid th{background:var(--head);text-align:left;padding:9px 10px;font-size:13px;color:#5b4636;font-weight:600}
.grid td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid td.num,.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
.no{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pill{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:#e6f6ed;color:var(--ok)}
.pill.w{background:#fff4d6;color:var(--warn)}.pill.g{background:#eee;color:#555}
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:220px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center}
.kv>label{font-weight:600}
.preview{display:grid;gap:6px}
.preview div{display:flex;gap:8px;align-items:center}
.sw{width:36px;height:20px;border-radius:10px;background:var(--ok);position:relative;display:inline-block}.sw::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.off{background:#ccc}.sw.off::after{right:auto;left:2px}
.mini{font-size:12px;color:var(--muted)}
.drawer{background:#fff;border-left:1px solid var(--line);padding:16px;display:grid;gap:10px;align-content:start}
.kds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tk{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tk .h{padding:10px 12px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.tk .h b{font-size:19px}
.tk ul{list-style:none;margin:0;padding:10px 12px;display:grid;gap:6px}
.tk .ft{padding:8px 12px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.paper{width:300px;background:#fff;padding:16px 18px;font-family:"Courier New",monospace;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:13px}
.paper .c{text-align:center}.paper hr{border:0;border-top:1px dashed #999}
/* phone */
.phone{width:390px;margin:0 auto;background:var(--card);min-height:100vh;display:flex;flex-direction:column}
.phone .top{height:50px}
.phone .body{padding:12px;display:grid;gap:10px;flex:1;align-content:start}
.hs{display:flex;gap:8px;overflow:hidden}
.hs .pb{min-width:120px}
.fixbar{position:sticky;bottom:0;background:var(--brand-dark);color:#fff;padding:10px 12px;display:grid;gap:8px}
.phonebox{width:390px;border-radius:28px;border:8px solid #2a2a2a;overflow:hidden;background:#fffaf2;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.url{background:#eee;color:#333;font-size:12px;padding:6px 12px;text-align:center}
.url b{color:#111}
.ctop{background:var(--brand) repeating-radial-gradient(circle at 0 0,transparent 0 10px,rgba(255,255,255,.06) 10px 11px);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.cover{height:150px;background:linear-gradient(135deg,#8c3b1e,#d98b3a);display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:20px}
.sinfo{padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:12px;background:#a02c20;color:#fff;display:grid;place-items:center;font-weight:800}
.dish{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dish .im{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#f3c98b,#c96f2d);flex:none}
.bnav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 0 12px;background:#fff;font-size:12px;color:var(--muted)}
.bnav .on{color:var(--brand);font-weight:700}
.note{max-width:300px;display:grid;gap:8px;font-size:13px}
.note h4{margin:0;font-size:16px}
.good{color:var(--ok)}.badx{color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const s = new URLSearchParams(location.search).get('s') || '1';
const side = (on) => `<aside class="side"><div class="shop">马卡蒂小馆</div><div class="who"><b>店主</b>店长 owner1</div>

'2': () => `<div class="phone">
